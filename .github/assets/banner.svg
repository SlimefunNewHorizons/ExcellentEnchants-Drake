<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="ExcellentEnchants Drake Edition">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2419"/><stop offset="55%" stop-color="#123a28"/><stop offset="100%" stop-color="#0a1a13"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe289"/><stop offset="50%" stop-color="#ffb347"/><stop offset="100%" stop-color="#ffe289"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="brillo"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="760" height="150" rx="10" fill="url(#sky)"/>
  <g fill="#6fe3a2" opacity=".5">
    <circle cx="80" cy="40" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="112" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="35" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="118" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="22" r="1.2"><animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(58,75)">
    <path d="M0,-26 L7,-8 L26,-8 L11,3 L17,22 L0,11 L-17,22 L-11,3 L-26,-8 L-7,-8 Z"
          fill="url(#oro)" filter="url(#brillo)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="112" y="62" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="url(#oro)">ExcellentEnchants</text>
  <text x="112" y="88" font-family="Georgia,serif" font-size="19" fill="#6fe3a2">Drake Edition</text>
  <text x="112" y="114" font-family="system-ui,sans-serif" font-size="12.5" fill="#9fc4ac">Fork de DrakesCraft · compatible con Slimefun</text>
  <rect x="112" y="124" width="0" height="2.5" rx="1.2" fill="url(#oro)">
    <animate attributeName="width" values="0;330;0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
